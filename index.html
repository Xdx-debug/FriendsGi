<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giovanna, qual Friend é você?</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#4b2c86;--ink:#2a1650;--paper:#fff8e7;--yel:#f9c22e;--red:#e2453c;--blue:#2f80c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;overflow-x:hidden}
.logo{width:min(320px,80vw);background:var(--paper);border:6px solid var(--yel);border-radius:18px;padding:14px 18px;margin:6px 0 14px;box-shadow:0 8px 0 rgba(0,0,0,.25);animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
.logo img{display:block;width:100%;height:auto}
.dots{display:flex;gap:10px;margin:0 0 16px}
.dots i{width:20px;height:20px;border-radius:50%;animation:bounce 1.2s ease-in-out infinite}
.dots i:nth-child(3n+1){background:var(--red)}.dots i:nth-child(3n+2){background:var(--yel)}.dots i:nth-child(3n){background:var(--blue)}
.dots i:nth-child(2){animation-delay:.12s}.dots i:nth-child(3){animation-delay:.24s}.dots i:nth-child(4){animation-delay:.36s}.dots i:nth-child(5){animation-delay:.48s}.dots i:nth-child(6){animation-delay:.6s}
h1{font-family:'Bowlby One',Impact,sans-serif;font-weight:400;color:var(--yel);font-size:clamp(26px,7vw,38px);line-height:1.08;text-align:center;margin:0 0 18px;max-width:16ch}
.frame{width:100%;max-width:460px;background:var(--paper);border:8px solid var(--yel);border-radius:22px;padding:24px 20px;box-shadow:0 10px 0 rgba(0,0,0,.25);position:relative}
.step{animation:slide .35s ease-out both}
.frame p{font-size:17px;line-height:1.5;margin:0 0 16px}
.q{font-weight:800;font-size:19px!important}
.prog{font-size:14px!important;font-weight:700;color:#6b5a94}
.bar{height:8px;background:#e6dcc0;border-radius:99px;margin:0 0 16px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .4s}
button{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:13px 14px;margin:0 0 10px;font-weight:700;color:var(--ink);transition:transform .12s,background .12s;animation:slide .35s ease-out both}
.opt:hover{background:#ffe9a8;transform:translateX(4px)}.opt:active{transform:scale(.97)}
.opt:focus-visible,.cta:focus-visible,.ghost:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.cta{background:var(--red);color:#fff;border:0;border-radius:999px;padding:14px 26px;font-weight:800;font-size:17px;text-decoration:none;display:inline-block;box-shadow:0 4px 0 #a52b24;transition:transform .12s}
.cta:hover{transform:translateY(-2px) rotate(-1deg)}.cta:active{transform:translateY(3px);box-shadow:none}
.ghost{background:transparent;border:2px dashed #8f7fb8;color:#6b5a94;border-radius:999px;padding:10px 18px;font-weight:700;margin-left:8px;position:relative;transition:transform .25s}
.who{font-family:'Bowlby One',Impact,sans-serif;font-size:34px;margin:0 0 10px;color:var(--red);line-height:1.1;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.card{background:var(--ink);color:var(--yel);border-radius:14px;padding:22px 16px;text-align:center;margin:8px 0 18px}
.card small{display:block;color:#e8dcff;font-size:13px;margin-bottom:8px}
.card b{font-family:'Bowlby One',Impact,sans-serif;font-weight:400;font-size:21px;line-height:1.25}
.center{text-align:center}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes slide{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<h1 id="title">Giovana, qual Friend é você?</h1>
<main class="frame" id="app"></main>

<script>
const NOME = "Giovana";
const REMETENTE = "Gabriel";
const WHATSAPP = "5511930259246";

const P = {
  monica:{n:"Monica", t:"Organizada, intensa e a melhor anfitriã da parada. Se você faz, fica perfeito, e ninguém sai da sua casa com fome. Só cuidado pra não limpar até a casa dos outros kkkk"},
  rachel:{n:"Rachel", t:"Estilosa, corajosa e sempre se reinventando. Você muda de rumo quando precisa e volta arrasando, com muito mais personalidade. Tá ligada que dá pra confiar no seu gosto."},
  phoebe:{n:"Phoebe", t:"Diferentona no melhor sentido. Você enxerga o que ninguém vê, vive no seu ritmo e deixa qualquer rolê mais leve e mais divertido. Ninguém é igual a você."},
  joey:{n:"Joey", t:"Pura resenha. Você é leal, carismática e sabe que a vida fica bem melhor com comida boa e gente boa por perto. Fácil de gostar, mano."}
};
const Q = [
 ["Sábado à noite. Qual a melhor programação?",[["monica","Chamar a galera pra casa e caprichar no jantar"],["rachel","Me arrumar toda e ir num lugar novo"],["phoebe","Sem plano, deixo a vida me levar"],["joey","Pizza, sofá e maratona, sem estresse"]]],
 ["Deu ruim. Oque você faz?",[["monica","Planilha e plano B, sempre"],["rachel","Pergunto pra geral e faço do meu jeito"],["phoebe","Confio no universo, uma hora se ajeita"],["joey","Como primeiro, penso depois kkkk"]]],
 ["Chegou atrasada. Qual a desculpa?",[["monica","Eu? Atrasada? Jamais"],["rachel","O look não fechou, pô"],["phoebe","O caminho me levou pra outro lugar"],["joey","Tinha comida no caminho, fazer o quê"]]],
 ["No Central Perk, você pede:",[["monica","O café certinho, do jeito que tem que ser"],["rachel","O maior que tiver, cheio de coisa"],["phoebe","Qualquer um, se a companhia for boa"],["joey","Um café e um sanduíche, de boa"]]],
 ["Como você quer ser lembrada?",[["monica","Pela dedicação"],["rachel","Pelo estilo e pela evolução"],["phoebe","Por ser diferentona"],["joey","Pela resenha e pela alegria"]]]
];
const app = document.getElementById("app");
let i = 0, score = {monica:0,rachel:0,phoebe:0,joey:0};

function start(){
  app.innerHTML = '<div class="step"><p>Ooi minha vida! Separei cinco Perguntas pra descobrir qual Friend você é. Depois tem uma surpresa esperando você.</p><div class="center"><button class="cta" id="go">Bora começar</button></div></div>';
  document.getElementById("go").onclick = ask;
}
function ask(){
  const [q,opts] = Q[i];
  app.innerHTML = '<p class="prog">Pergunta '+(i+1)+' de '+Q.length+'</p><div class="bar"><span style="width:'+(i/Q.length*100)+'%"></span></div><p class="q step">'+q+'</p>';
  opts.forEach(([k,t],n)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = t; b.style.animationDelay = (n*70)+"ms";
    b.onclick = ()=>{ score[k]++; i++; i<Q.length ? ask() : result(); };
    app.appendChild(b);
  });
  requestAnimationFrame(()=>{const s=app.querySelector(".bar span");if(s)s.style.width=((i+1)/Q.length*100)+"%"});
}
function result(){
  const top = Object.keys(score).sort((a,b)=>score[b]-score[a])[0];
  const c = P[top];
  document.getElementById("title").textContent = "Resultado saindo do forno";
  app.innerHTML = '<p class="prog">'+NOME+', você é a cara de</p><p class="who">'+c.n+'</p><p>'+c.t+'</p>'+
   '<div class="card"><small>Episódio especial</small><b>The One Where '+NOME+' and '+REMETENTE+' Get Dinner</b></div>'+
   '<p class="center">E aí, aceita o convite?</p><div class="center"><button class="cta" id="yes">Aceito!</button><button class="ghost" id="no">Deixa eu pensar</button></div>';
  confetti(30);
  const no = document.getElementById("no");
  const dodge = e=>{e.preventDefault();no.style.transform="translate("+((Math.random()*160-80)|0)+"px,"+((Math.random()*90-45)|0)+"px) rotate("+((Math.random()*30-15)|0)+"deg)"};
  no.addEventListener("mouseenter",dodge);no.addEventListener("touchstart",dodge,{passive:false});no.addEventListener("click",dodge);
  document.getElementById("yes").onclick = ()=>{
    confetti(80);
    const link = '<p class="center"><a class="cta" href="https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent("Aceitei o convite do episódio, Gabriel! Bora marcar?")+'">Avisar o Gabriel no WhatsApp</a></p>';
    app.innerHTML = '<p class="who center">Fechou!</p><p class="center">Episódio confirmado. Agora só falta escolher o dia e o lugar. Manda um salve pra ele aí embaixo.</p>'+link;
  };
}
function confetti(n){
  const cs=["#e2453c","#f9c22e","#2f80c8","#fff8e7"];
  for(let k=0;k<n;k++){
    const d=document.createElement("div");d.className="conf";
    d.style.left=Math.random()*100+"vw";d.style.background=cs[k%4];
    d.style.animationDuration=(2+Math.random()*2)+"s";d.style.animationDelay=(Math.random()*.6)+"s";
    document.body.appendChild(d);setTimeout(()=>d.remove(),5000);
  }
}
start();
</script>
